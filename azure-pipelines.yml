trigger:
  branches:
    include:
      - '*'

pr:
  branches:
    include:
      - '*'

pool:
  vmImage: ubuntu-latest

jobs:
  - job: checkout_metadata
    displayName: Checkout & Export Metadata
    steps:
      - checkout: self
        fetchDepth: 0

      - bash: |
          SHORT_SHA=$(git rev-parse --short=7 HEAD)
          RAW_BRANCH="${BUILD_SOURCEBRANCH}"
          # Strip refs/heads/ or refs/pull/.../merge
          BRANCH_NAME="${RAW_BRANCH#refs/heads/}"
          BRANCH_NAME="${BRANCH_NAME#refs/pull/}"
          BRANCH_NAME="${BRANCH_NAME%/merge}"
          # Slugify: lowercase, replace non-alphanumeric with dash, trim dashes
          BRANCH_SLUG=$(echo "$BRANCH_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g' | sed 's/-\+/-/g' | sed 's/^-//;s/-$//')

          echo "##vso[task.setvariable variable=SHORT_SHA;isOutput=true]$SHORT_SHA"
          echo "##vso[task.setvariable variable=BRANCH_SLUG;isOutput=true]$BRANCH_SLUG"

          echo "SHORT_SHA  : $SHORT_SHA"
          echo "BRANCH_SLUG: $BRANCH_SLUG"
        name: set_metadata
        displayName: Compute and export SHORT_SHA & BRANCH_SLUG
